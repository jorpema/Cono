<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lengua Castellana 3º · Unidades 1 y 2</title>
<meta name="description" content="Repaso interactivo de Lengua Castellana de 3º de Primaria: sonido K, sonido G suave, sinónimos, antónimos, comprensión lectora y el poema.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root{
  --bg:#fff7ef; --bg2:#ffefd9; --ink:#2b2d42; --muted:#6b6f80; --card:#fff; --line:#eadfcb;
  --good:#22a861; --goodbg:#dbf7e8; --bad:#e63950; --badbg:#ffe0e5; --gold:#ffc23d;
  --shadow:0 6px 0 rgba(43,45,66,.12); --mc:#e63950;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;
  background-image:radial-gradient(circle at 12% 8%,#ffd9de 0 120px,transparent 121px),radial-gradient(circle at 92% 28%,#dbe8ff 0 160px,transparent 161px),
  radial-gradient(circle at 8% 88%,#fff0b8 0 140px,transparent 141px);background-attachment:fixed}
button,input,textarea{font-family:inherit;color:inherit}
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles span{position:absolute;bottom:-80px;opacity:.3;animation:rise linear infinite;font-size:34px}
@keyframes rise{to{transform:translateY(-120vh) rotate(40deg)}}
.app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:16px 16px 120px}
.screen{display:none}
.screen.active{display:block;animation:screenIn .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes screenIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;box-shadow:var(--shadow)}
.iconbtn{cursor:pointer;background:#fff;border:3px solid var(--ink);border-radius:16px;min-width:48px;height:48px;font-size:22px;display:grid;place-items:center;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);padding:0 10px}
.iconbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,45,66,.12)}
.badge{display:inline-block;background:var(--bad);color:#fff;border-radius:12px;padding:4px 12px;font-weight:600;font-size:15px}

.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin:22px 0 10px}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.03;margin:6px 0 8px;font-weight:700}
.hero h1 .hl{color:#e63950;display:inline-block;animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.speech{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:12px 16px;font-size:18px;font-weight:500;box-shadow:var(--shadow);max-width:560px}
.mascot{width:130px;height:130px;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.mascot.jump{animation:jump .6s ease}
.mascot.sad{animation:sad .7s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes jump{30%{transform:translateY(-26px) scale(1.06,.95)}60%{transform:scale(1.1,.9)}}
@keyframes sad{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.mascot .eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

/* mapa */
.missions{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 14px;margin-top:26px}
.mission-btn{cursor:pointer;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:popIn .55s cubic-bezier(.2,.9,.3,1.4) forwards}
.mission-btn:nth-child(even){margin-top:46px}
@keyframes popIn{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:none}}
.disc{position:relative;width:min(120px,22vw);aspect-ratio:1;border-radius:32%;background:var(--col);border:4px solid var(--ink);display:grid;place-items:center;
  font-size:clamp(34px,7vw,54px);box-shadow:0 8px 0 var(--ink);animation:float 3.5s ease-in-out infinite;animation-delay:var(--d);transition:transform .2s}
.disc:after{content:"";position:absolute;inset:8px;border-radius:28%;border:3px dashed rgba(255,255,255,.55)}
.mission-btn:hover .disc{transform:scale(1.08) rotate(-5deg)}
@keyframes float{50%{translate:0 -7px}}
.num{position:absolute;top:-8px;left:-8px;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--ink);font-size:17px;font-weight:700;display:grid;place-items:center}
.done-mark{position:absolute;bottom:-8px;right:-8px;width:36px;height:36px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);font-size:18px;display:grid;place-items:center}
.name{font-weight:600;font-size:clamp(15px,2.4vw,19px);text-align:center;line-height:1.1;max-width:150px}
.stars{font-size:20px;letter-spacing:2px;color:#d9cdb7}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #c98a00}
.teacher-btn{cursor:pointer;margin:42px auto 0;display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#c9b6ff,#8f5cf7);color:#fff;
  border:4px solid var(--ink);border-radius:28px;padding:16px 26px;box-shadow:0 8px 0 var(--ink);font-size:clamp(20px,4vw,26px);font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.teacher-btn .ic{font-size:44px}
.teacher-btn small{display:block;font-size:15px;font-weight:500}
.teacher-btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.foot{margin-top:40px;text-align:center;color:var(--muted);font-size:14px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}

/* sección */
.mbar{display:flex;align-items:center;gap:12px}
.mtitle{display:flex;align-items:center;gap:10px;font-size:clamp(21px,4.5vw,32px);font-weight:700;flex:1;min-width:0}
.mtitle .em{width:54px;height:54px;flex:none;border-radius:30%;background:var(--mc);border:3px solid var(--ink);display:grid;place-items:center;font-size:28px}
.tabs{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
.tab{cursor:pointer;min-width:46px;height:42px;padding:0 12px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--ink);position:relative}
.tab.cur{background:var(--mc);color:#fff;transform:translateY(-3px)}
.tab .mk{position:absolute;top:-10px;right:-10px;font-size:15px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);background:#fff}
.stage{background:#fff;border:4px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);padding:22px}
.enter{animation:stepIn .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes stepIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.act-h{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:clamp(20px,3.8vw,27px);flex-wrap:wrap}
.tag{font-size:14px;background:var(--mc);color:#fff;border-radius:10px;padding:3px 10px;font-weight:600;white-space:nowrap}
.tag.open{background:#8f5cf7}
.help{color:var(--muted);font-size:17px;margin:0 0 16px}

/* recuerda */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.rcard{border:3px solid var(--ink);border-radius:20px;padding:14px;background:var(--bg2);box-shadow:var(--shadow);opacity:0;animation:popIn .5s cubic-bezier(.2,.9,.3,1.4) forwards;font-size:18px;line-height:1.35}
.rcard .e{font-size:40px;line-height:1}
.rcard h3{margin:6px 0;font-size:21px;color:var(--mc)}
.rcard .ex{font-style:italic;color:var(--muted)}
.rcard b{color:var(--mc)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{cursor:pointer;border:4px solid var(--ink);border-radius:18px;padding:11px 20px;font-size:19px;font-weight:700;background:var(--mc);color:#fff;
  box-shadow:0 6px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .15s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink);text-shadow:none}
.btn.check{background:var(--good)}
.btn.again{background:#ff9f1c}
.btn[disabled]{opacity:.4;pointer-events:none}

/* lectura */
.reading{background:#fffbea;border:3px solid #f1d27a;border-radius:20px;padding:16px 18px;margin-bottom:18px;font-size:clamp(17px,2.8vw,20px);line-height:1.55}
.reading h3{margin:0 0 8px;color:#b5651d;font-size:24px}
.reading p{margin:0 0 10px;text-indent:1.2em}
.reading details summary{cursor:pointer;font-weight:700;color:#b5651d}
.voc{font-size:15px;color:var(--muted);border-top:2px dashed #f1d27a;margin-top:8px;padding-top:8px}

/* fichas */
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border:3px dashed var(--line);border-radius:20px;background:#fffdf8;min-height:70px;margin-bottom:18px;transition:box-shadow .2s}
.pool.hover{box-shadow:0 0 0 5px var(--gold)}
.pool:empty:before{content:"Todas las fichas están colocadas. ¡Pulsa Corregir!";color:var(--muted);font-size:15px;align-self:center}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:#fff;border:3px solid var(--ink);border-radius:15px;padding:8px 14px;
  font-size:18px;font-weight:500;box-shadow:0 5px 0 var(--ink);transition:transform .15s,opacity .2s;line-height:1.15;text-align:center}
.chip:hover{transform:translateY(-3px) rotate(-1deg)}
.chip.sel{background:#fff3c4;transform:translateY(-4px) scale(1.06);box-shadow:0 0 0 4px var(--gold),0 7px 0 var(--ink)}
.chip.src{opacity:.25}
.zone .chip{box-shadow:0 3px 0 var(--ink);animation:pop .35s cubic-bezier(.2,.9,.3,1.6)}
.chip.locked{cursor:default}
.chip.locked:hover{transform:none}
.chip.ok{background:var(--goodbg);border-color:var(--good);color:#11663a}
.chip.ok:after{content:" ✔"}
.chip.ko{background:var(--badbg);border-color:var(--bad);color:#a3142a;animation:shake .45s}
.chip.ko:after{content:" ✘"}
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;box-shadow:0 14px 24px rgba(0,0,0,.2),0 5px 0 var(--ink)}
.ghost.back{transition:transform .3s cubic-bezier(.4,1.6,.6,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.shake{animation:shake .45s}
@keyframes shake{20%{translate:-8px}40%{translate:8px}60%{translate:-5px}80%{translate:5px}}
.zone{transition:transform .2s,box-shadow .2s}
.zone.hover{transform:scale(1.03);box-shadow:0 0 0 5px var(--gold)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.bucket{border:3px solid var(--ink);border-radius:20px;background:var(--bc,#f3f3f3);min-height:150px;padding:10px;display:flex;flex-direction:column;cursor:pointer}
.bucket .bh{text-align:center;font-weight:700;font-size:20px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;margin-bottom:10px}
.zone-items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start;flex:1}
.zone-items .chip{font-size:16px;padding:6px 10px}

/* huecos */
.lines{font-size:clamp(19px,3.2vw,23px);line-height:2.3}
.lines p{margin:0 0 6px}
.lines.list p{border-bottom:2px dashed var(--line);padding:2px 0}
.gap{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:var(--w,110px);min-height:46px;border-bottom:4px solid var(--mc);
  background:#f6f1e6;border-radius:12px 12px 4px 4px;margin:0 4px;padding:2px 4px;cursor:pointer}
.gap .chip{font-size:18px;padding:3px 10px;border-width:2px}
.gap.ko{background:var(--badbg);border-bottom-color:var(--bad)}
.tin{font-size:inherit;font-weight:600;border:0;border-bottom:4px solid var(--mc);background:#f6f1e6;border-radius:10px 10px 3px 3px;padding:2px 8px;
  width:var(--w,120px);text-align:center;margin:0 3px;outline:none;color:#1d4ed8}
.tin:focus{box-shadow:0 0 0 3px var(--gold)}
.tin.ok{background:var(--goodbg);border-bottom-color:var(--good);color:#11663a}
.tin.ko{background:var(--badbg);border-bottom-color:var(--bad);color:#a3142a;animation:shake .45s}
.tin::placeholder{color:#b9ad97;font-weight:500}

/* parejas */
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pair{display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:18px;padding:8px 10px;background:var(--bg2)}
.pair .w{font-weight:700;font-size:19px;min-width:90px}
.pair .arrow{font-size:20px}
.slot{flex:1;min-height:50px;border:3px dashed var(--ink);border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:4px}
.slot .chip{font-size:17px;padding:5px 10px}
.slot.ko{border-color:var(--bad);background:var(--badbg)}
/* ordenar */
.olist{display:grid;gap:10px}
.orow{display:flex;align-items:center;gap:10px}
.orow .n{width:38px;height:38px;flex:none;border-radius:50%;background:var(--mc);color:#fff;border:3px solid var(--ink);font-weight:700;display:grid;place-items:center}

/* elegir */
.q{border:3px solid var(--ink);border-radius:18px;padding:12px 14px;margin-bottom:12px;background:#fffdf8}
.q p{margin:0 0 10px;font-weight:600;font-size:19px}
.opts{display:grid;gap:8px}
.opt{cursor:pointer;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:9px 12px;font-size:17px;font-weight:500;box-shadow:0 4px 0 var(--ink);display:flex;gap:10px;align-items:center}
.opt .l{width:30px;height:30px;flex:none;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-weight:700;background:var(--bg2);font-size:15px}
.opt.sel{background:#fff3c4;transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.opt.sel .l{background:var(--gold)}
.opt.ok{background:var(--goodbg);border-color:var(--good)}
.opt.ok .l{background:var(--good);color:#fff}
.opt.ko{background:var(--badbg);border-color:var(--bad);animation:shake .45s}
.opt.ko .l{background:var(--bad);color:#fff}
.q.miss{border-color:var(--bad)}
.opt[disabled]{cursor:default}

/* poema */
.poem{background:linear-gradient(#fff,#fff8ee);border:3px solid var(--ink);border-radius:22px;padding:18px 24px;margin:0 auto 18px;max-width:520px;box-shadow:var(--shadow);
  font-size:clamp(19px,3.4vw,23px);line-height:1.6;position:relative}
.poem h3{margin:0 0 10px;text-align:center;color:var(--mc);font-size:26px}
.poem .st{margin-bottom:18px}
.poem .st:last-child{margin-bottom:0}
.poem:after{content:"✒️";position:absolute;right:14px;bottom:8px;font-size:28px;opacity:.6}
.pq{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;margin:10px 0;flex-wrap:wrap}
.pq .tin{--w:70px}
h4.sub{font-size:20px;margin:18px 0 10px}

/* abiertas */
.open-q{margin-bottom:14px}
.open-q label{display:block;font-weight:600;font-size:19px;margin-bottom:6px}
.open-q textarea,.open-q input{width:100%;font-size:19px;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;background:#fdfbff;outline:none;resize:vertical}
.open-q textarea:focus,.open-q input:focus{box-shadow:0 0 0 4px #c9b6ff}
.saved{color:#6b4bd1;font-weight:600;font-size:15px;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
.note{background:#f1ebff;border:3px dashed #8f5cf7;border-radius:16px;padding:10px 14px;font-size:16px;margin-bottom:16px}

/* barra de corrección */
.checkbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-top:20px;padding:14px 16px;border-radius:20px;border:3px solid var(--line);background:#fffdf8}
.checkbar .msg{font-size:20px;font-weight:700}
.checkbar.good{background:var(--goodbg);border-color:var(--good);animation:popIn .45s forwards}
.checkbar.mid{background:#fff4d6;border-color:#f0b400;animation:popIn .45s forwards}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:44px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-size:21px;font-weight:700;margin-right:6px;padding:0 8px}

/* respuestas */
.rep-name{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:20px;font-weight:600;margin-bottom:16px}
.rep-name input{flex:1;min-width:200px;font-size:20px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px}
.rep-sec{border:3px solid var(--ink);border-radius:18px;padding:12px 16px;margin-bottom:14px}
.rep-sec h3{margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rep-item{margin:6px 0 10px}
.rep-item .qq{font-weight:600}
.rep-item .aa{background:#f6f1ff;border-radius:10px;padding:6px 10px;white-space:pre-wrap;min-height:34px}
.rep-item .aa.empty{color:#b04a5a;font-style:italic;background:#fff0f2}
.rep-scores{font-size:16px;color:var(--muted)}

/* mascota acompañante */
.buddy{position:fixed;right:12px;bottom:10px;z-index:50;display:none;align-items:flex-end;gap:6px;pointer-events:none}
.buddy .mascot{width:82px;height:82px}
.buddy .say{background:#fff;border:3px solid var(--ink);border-radius:18px 18px 4px 18px;padding:8px 12px;font-weight:600;font-size:17px;box-shadow:var(--shadow);max-width:230px;opacity:0;transform:scale(.6) translateY(10px);transform-origin:right bottom;transition:all .3s cubic-bezier(.2,.9,.3,1.5)}
.buddy .say.show{opacity:1;transform:none}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1200}

@media (max-width:640px){
  .missions{grid-template-columns:repeat(2,1fr);gap:24px 10px}
  .disc{width:min(118px,34vw)}
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .hero .mascot{width:110px;height:110px}
  .stage{padding:14px;border-radius:22px}
  .chip{font-size:15px;padding:7px 10px;border-radius:13px;box-shadow:0 4px 0 var(--ink)}
  .pool{gap:8px;padding:10px}
  .buckets{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .bucket{min-height:110px;padding:8px}
  .bucket .bh{font-size:16px;padding:5px}
  .zone-items .chip{font-size:14px;padding:4px 8px}
  .pairs{grid-template-columns:1fr}
  .lines{line-height:2.1}
  .buddy .mascot{width:62px;height:62px}
  .buddy .say{font-size:15px}
  .mtitle .em{width:44px;height:44px;font-size:24px}
  .tab{min-width:40px;height:38px;font-size:15px;padding:0 9px}
}
@media print{
  body{background:#fff}
  .bubbles,.buddy,canvas,.screen:not(#screen-report),.noprint{display:none!important}
  #screen-report{display:block!important;animation:none}
  .stage{box-shadow:none;border:2px solid #000}
  .rep-sec{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div class="bubbles" id="bubbles"></div>
<div class="app">

  <!-- ============ MAPA ============ -->
  <section class="screen active" id="screen-map">
    <div class="top">
      <a class="iconbtn" href="index.html" title="Volver al índice">🏠</a>
      <span class="badge">Lengua Castellana · 3º</span>
      <span class="spacer"></span>
      <span class="pill">⭐ <span id="totalStars">0</span> / <span id="maxStars">18</span></span>
      <button class="iconbtn sndbtn" aria-label="Sonido">🔊</button>
    </div>
    <div class="hero">
      <div id="heroMascot"></div>
      <div>
        <span class="badge" style="background:#3a86ff">Unidades 1 y 2</span>
        <h1>¡Repasamos para el <span class="hl">examen</span>!</h1>
        <div class="speech" id="heroSpeech">¡Hola! Soy <b>Leo</b> 📖. Elige un tema, haz los ejercicios y pulsa <b>Corregir</b> al final. Si fallas algo, ¡repítelo para mejorar!</div>
      </div>

  n.forEach(([f,s,d])=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0+s);g.gain.linearRampToValueAtTime(vol,t0+s+.02);
  g.gain.exponentialRampToValueAtTime(.001,t0+s+d);o.connect(g).connect(this.ctx.destination);o.start(t0+s);o.stop(t0+s+d+.05);});}catch(e){}},
  pick(){this.play([[520,0,.06]],'sine',.08)},drop(){this.play([[440,0,.06],[560,.04,.08]],'triangle',.1)},
  good(){this.play([[523,0,.15],[659,.13,.15],[784,.26,.15],[1047,.39,.4]],'triangle',.2)},

const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],run=false;
function confetti(n=120){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const cols=['#e63950','#ffb703','#3a86ff','#2fbf71','#8f5cf7','#fb8500','#06b6a4'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*240,y:innerHeight*.5,vx:(Math.random()-.5)*16,vy:-Math.random()*16-6,r:Math.random()*6+4,c:pick(cols),rot:Math.random()*6,vr:(Math.random()-.5)*.3,life:0});
  if(!run){run=true;requestAnimationFrame(tick);}}
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);parts.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<260);if(parts.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,innerWidth,innerHeight);}}

  const avg=autos.reduce((a,[e,i])=>a+(P.best[exId(s,i)]||0),0)/autos.length;
  return avg>=.9?3:avg>=.7?2:avg>=.4?1:0;
}

/* ---------- corregir / repetir ---------- */
function addCheckBar(box,area,ex,id){
  const bar=el('div','checkbar');const msg=el('span','msg',P.best[id]!=null?`Tu mejor nota: ${Math.round(P.best[id]*10)} / 10`:'Cuando termines, pulsa Corregir.');
  const b=el('button','btn check','✔ Corregir');bar.append(msg,b);box.appendChild(bar);
  b.onclick=()=>{
    const r=check(area);if(r.missing&&!confirm(`Te faltan ${r.missing} por responder. ¿Quieres corregir igualmente?`))return;
    lock(area);const ratio=r.ok/r.total;P.best[id]=Math.max(P.best[id]||0,ratio);save();renderTabs();
    bar.className='checkbar '+(ratio===1?'good':'mid');
    msg.innerHTML=`<span class="score">${r.ok}/${r.total}</span>`+(ratio===1?'¡Perfecto! Todo correcto 🎉':ratio>=.7?'¡Muy bien! Mira lo que está en rojo y repítelo para sacar un 10.':'Fíjate en los errores en rojo y vuelve a intentarlo. ¡Tú puedes!');
    if(ratio===1){Sound.good();confetti(140);say(pick(['¡Fantástico! ⭐','¡Lo has bordado!','¡Eres un crack! 🎉']),'jump');}
    else if(ratio>=.7){Sound.mid();say('¡Casi! Repítelo para mejorar 💪','jump');}else{Sound.bad();say('No pasa nada. ¡Repite el ejercicio! 🙂','sad');}
    b.className='btn again';b.textContent='🔁 Repetir ejercicio';
    b.onclick=()=>{Sound.pick();renderStep();};
  };
}
function check(area){
  let ok=0,total=0,missing=0;
  area.querySelectorAll('.tin[data-answers]').forEach(i=>{total++;const v=norm(i.value);if(!v)missing++;const good=i.dataset.answers.split('|').map(norm).includes(v);if(good)ok++;i.classList.add(good?'ok':'ko');});
  area.querySelectorAll('.zone[data-cap="1"]').forEach(z=>{total++;const c=z.querySelector('.chip');if(!c){missing++;z.classList.add('ko');return;}
    const good=norm(z.dataset.accept)===c.dataset.val;if(good)ok++;c.classList.add(good?'ok':'ko');});
  area.querySelectorAll('.chip[data-req]').forEach(c=>{total++;const z=c.closest('.bucket');if(!z){missing++;c.classList.add('ko');return;}
    const good=z.dataset.accept===c.dataset.val;if(good)ok++;c.classList.add(good?'ok':'ko');});
  area.querySelectorAll('[data-choice]').forEach(q=>{total++;const sel=q.dataset.sel;if(sel==null){missing++;q.classList.add('miss');return;}
    const btn=q.querySelector(`.opt[data-k="${sel}"]`);const good=sel===q.dataset.answer;if(good)ok++;btn.classList.add(good?'ok':'ko');});
  return{ok,total,missing};
}
function lock(area){area.querySelectorAll('.chip').forEach(c=>{c.classList.add('locked');c.classList.remove('sel');});area.querySelectorAll('input,.opt').forEach(i=>i.disabled=true);
  area.querySelectorAll('.pool .chip:not(.ko)').forEach(c=>c.style.opacity=.5);}

/* ================= arrastrar (ratón + táctil) — colocación libre ================= */
let D=null,selected=null,hoverT=null;
const targetAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e?(e.closest('#stage .zone')||e.closest('#stage .pool')):null;};
function exOf(n){return n.closest('.ex');}
function place(chip,target){
  if(exOf(chip)!==exOf(target))return false;
  if(target.classList.contains('pool')){target.appendChild(chip);}
  else{if(target.dataset.cap==='1'){const old=target.querySelector('.chip');if(old&&old!==chip)exOf(target).querySelector('.pool').appendChild(old);target.classList.remove('ko');}
    (target.querySelector('.zone-items')||target).appendChild(chip);}
  chip.classList.remove('sel','src');Sound.drop();return true;
}
document.addEventListener('pointerdown',e=>{const c=e.target.closest('#stage .chip:not(.locked)');if(!c||(e.button!==undefined&&e.button!==0))return;D={chip:c,x0:e.clientX,y0:e.clientY,moved:false,id:e.pointerId};});
document.addEventListener('pointermove',e=>{
  if(!D||e.pointerId!==D.id)return;
  if(!D.moved){if(Math.hypot(e.clientX-D.x0,e.clientY-D.y0)<7)return;D.moved=true;const r=D.chip.getBoundingClientRect();D.offX=D.x0-r.left;D.offY=D.y0-r.top;
    const g=D.chip.cloneNode(true);g.classList.add('ghost');g.classList.remove('sel');g.style.width=r.width+'px';document.body.appendChild(g);D.ghost=g;D.chip.classList.add('src');
    if(selected){selected.classList.remove('sel');selected=null;}Sound.pick();requestAnimationFrame(autoScroll);}
  e.preventDefault();D.cx=e.clientX;D.cy=e.clientY;D.ghost.style.transform=`translate(${e.clientX-D.offX}px,${e.clientY-D.offY}px) rotate(-4deg) scale(1.06)`;hover();
},{passive:false});
function hover(){if(!D)return;const t=targetAt(D.cx,D.cy);if(t!==hoverT){hoverT?.classList.remove('hover');hoverT=t;t?.classList.add('hover');}}
function autoScroll(){if(!D||!D.moved)return;const edge=Math.min(110,innerHeight*.18);let v=0;
  if(D.cy>innerHeight-edge)v=Math.ceil((D.cy-(innerHeight-edge))/edge*18);else if(D.cy<edge)v=-Math.ceil((edge-D.cy)/edge*18);
  if(v){scrollBy(0,v);hover();}requestAnimationFrame(autoScroll);}
function endDrag(e,cancel){
  if(!D||(e&&e.pointerId!==D.id))return;const d=D;D=null;hoverT?.classList.remove('hover');hoverT=null;
  if(!d.moved){if(cancel)return;
    if(selected&&selected!==d.chip){const z=d.chip.closest('.zone');if(z){const s=selected;selected=null;place(s,z);return;}}
    if(selected===d.chip){d.chip.classList.remove('sel');selected=null;}else{selected?.classList.remove('sel');selected=d.chip;d.chip.classList.add('sel');Sound.pick();}return;}
  const t=cancel?null:targetAt(e.clientX,e.clientY);
  if(t&&place(d.chip,t)){d.ghost.remove();}
  else{const r=d.chip.getBoundingClientRect();d.ghost.classList.add('back');d.ghost.style.transform=`translate(${r.left}px,${r.top}px)`;setTimeout(()=>{d.ghost.remove();d.chip.classList.remove('src');},300);}
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('click',e=>{if(!selected)return;if(e.target.closest('.chip'))return;const t=e.target.closest('#stage .zone')||e.target.closest('#stage .pool');if(!t)return;
  const c=selected;selected=null;if(!place(c,t))c.classList.remove('sel');});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const c=e.target.closest?.('#stage .chip:not(.locked)');
  if(c){e.preventDefault();selected?.classList.remove('sel');selected=c;c.classList.add('sel');return;}
  const z=e.target.closest?.('#stage .zone');if(z&&selected){e.preventDefault();const s=selected;selected=null;place(s,z);}});

/* ================= informe para la profe ================= */
function renderReport(){
  const r=$('#report');r.innerHTML='';
  r.appendChild(el('h2','act-h','<span class="tag open">📝</span> Mis respuestas para la profe'));
  r.appendChild(el('p','help noprint','Escribe tu nombre y pulsa <b>Imprimir</b> (o «Guardar como PDF») para entregárselo a tu maestra.'));
  const nm=el('div','rep-name','<span>Nombre:</span>');const ni=el('input');ni.value=P.name||'';ni.placeholder='Tu nombre y apellidos';ni.oninput=()=>{P.name=ni.value;save();};nm.appendChild(ni);r.appendChild(nm);
  r.appendChild(el('p','rep-scores',`Fecha: ${new Date().toLocaleDateString('es-ES')}`));
  SECTIONS.forEach(s=>{
    const sec=el('div','rep-sec');const scores=s.ex.map((e,i)=>isAuto(e)?`Ej. ${i+1}: ${P.best[exId(s,i)]!=null?Math.round(P.best[exId(s,i)]*10)+'/10':'—'}`:null).filter(Boolean).join(' · ');
    sec.appendChild(el('h3',null,`<span>${s.emoji} ${s.title}</span><span class="stars">${starStr(secStars(s))}</span>`));
    sec.appendChild(el('div','rep-scores','Mejor nota en los ejercicios autocorregidos: '+scores));
    s.ex.forEach((e,i)=>{if(e.type!=='open')return;sec.appendChild(el('h4',null,'✍️ '+e.title));
      e.prompts.forEach((p,k)=>{const v=(P.open[exId(s,i)+'-'+k]||'').trim();const it=el('div','rep-item');it.appendChild(el('div','qq',p.q));
        const aa=el('div','aa'+(v?'':' empty'));aa.textContent=v||'(sin responder)';it.appendChild(aa);sec.appendChild(it);});});
    r.appendChild(sec);});
  const row=el('div','nav noprint');const pr=el('button','btn','🖨️ Imprimir / Guardar PDF');pr.style.setProperty('--mc','#8f5cf7');pr.onclick=()=>window.print();
  const back=el('button','btn alt','⬅ Volver a los temas');back.onclick=()=>{renderMap();show('#screen-map');};row.append(back,pr);r.appendChild(row);
}

updSnd();renderMap();
</script>
