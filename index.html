<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repassem! · 3r de Primària</title>
<meta name="description" content="Activitats interactives per a repassar: Coneixement del Medi i Lengua Castellana de 3r de Primària.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎒</text></svg>">
<style>
:root{--ink:#2b2d42;--muted:#6b6f80;--bg:#fff7ec}
*{box-sizing:border-box}
body{margin:0;font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(circle at 10% 12%,#ffe3b0 0 140px,transparent 141px),radial-gradient(circle at 92% 20%,#d8f3e4 0 170px,transparent 171px),
  radial-gradient(circle at 85% 90%,#ffd9de 0 150px,transparent 151px),radial-gradient(circle at 8% 85%,#dbe8ff 0 140px,transparent 141px);background-attachment:fixed}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 60px;text-align:center}
.bag{font-size:84px;display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
h1{font-size:clamp(40px,8vw,72px);margin:4px 0 6px;line-height:1}
h1 span{display:inline-block;animation:pop .6s cubic-bezier(.2,.9,.3,1.6) both}
.sub{font-size:20px;color:var(--muted);margin:0 0 34px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:#fff;border:4px solid var(--ink);border-radius:30px;
  padding:26px 20px 24px;box-shadow:0 10px 0 var(--ink);transition:transform .2s;animation:pop .6s cubic-bezier(.2,.9,.3,1.4) both;position:relative;overflow:hidden}
.card:nth-child(2){animation-delay:.12s}
.card:hover{transform:translateY(-6px) rotate(-1deg)}
.card:active{transform:translateY(6px);box-shadow:0 3px 0 var(--ink)}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:110px;background:var(--c);border-bottom:4px solid var(--ink)}
.icon{position:relative;width:110px;height:110px;border-radius:50%;background:#fff;border:4px solid var(--ink);display:grid;place-items:center;font-size:58px;margin-top:20px}
.card h2{margin:6px 0 0;font-size:28px}
.card .u{display:inline-block;background:var(--c);color:#fff;font-weight:600;border-radius:12px;padding:4px 12px;font-size:16px;border:3px solid var(--ink)}
.card p{margin:0;color:var(--muted);font-size:17px}
.go{margin-top:8px;background:var(--c);color:#fff;font-weight:700;font-size:20px;border:3px solid var(--ink);border-radius:16px;padding:9px 20px;box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.18)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.foot{margin-top:40px;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bag">🎒</div>
  <h1><span>Repassem!</span></h1>
  <p class="sub">Activitats interactives · 3r de Primària</p>

  <div class="cards">
    <a class="card" href="medi-unitat1.html" style="--c:#2fbf71">
      <div class="icon">🌱</div>
      <span class="u">Unitat 1</span>
      <h2>Coneixement del Medi</h2>
      <p>Les persones som éssers vius</p>
      <span class="go">Entrar ➜</span>
    </a>
    <a class="card" href="castellano-unidades1-2.html" style="--c:#e63950">
      <div class="icon">📚</div>
      <span class="u">Unidades 1 y 2</span>
      <h2>Lengua Castellana</h2>
      <p>Sonido K y G suave · Sinónimos y antónimos · Comprensión lectora · El poema</p>
      <span class="go">Entrar ➜</span>
    </a>
  </div>

  <p class="foot">Tria una assignatura per a començar 👆</p>
</div>
</body>
</html>
