<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Les persones som éssers vius · Medi 3r</title>
<meta name="description" content="Repàs interactiu de la Unitat 1 de Coneixement del Medi de 3r de Primària: Les persones som éssers vius.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<style>
:root{
  --bg:#fff7e8; --bg2:#ffefd2; --ink:#2b2d42; --muted:#6b6f80; --card:#ffffff;
  --line:#eadfcb; --good:#2fbf71; --bad:#ef476f; --gold:#ffc23d;
  --c1:#2fbf71; --c2:#ffb703; --c3:#3a86ff; --c4:#ef476f; --c5:#8f5cf7; --c6:#fb8500; --c7:#06b6a4; --c8:#e85d9c;
  --shadow:0 6px 0 rgba(43,45,66,.12);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;
  color:var(--ink); background:var(--bg); overflow-x:hidden;
  background-image:radial-gradient(circle at 15% 10%,#ffe3b0 0 120px,transparent 121px),
                   radial-gradient(circle at 90% 30%,#d8f3e4 0 160px,transparent 161px),
                   radial-gradient(circle at 10% 85%,#dbe8ff 0 140px,transparent 141px);
  background-attachment:fixed;
}
button{font-family:inherit;color:inherit}
/* bombolles de fons */
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles span{position:absolute;bottom:-80px;border-radius:50%;opacity:.35;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) translateX(30px)}}

.app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:16px 16px 120px}
.screen{display:none}
.screen.active{display:block;animation:screenIn .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes screenIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- capçalera ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--ink);
  border-radius:999px;padding:6px 14px;font-weight:600;box-shadow:var(--shadow)}
.iconbtn{cursor:pointer;background:var(--card);border:3px solid var(--ink);border-radius:16px;
  min-width:48px;height:48px;font-size:22px;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s}
.iconbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,45,66,.12)}
.spacer{flex:1}

.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin:22px 0 10px}
.hero h1{font-size:clamp(30px,6vw,54px);line-height:1.02;margin:6px 0 8px;font-weight:700;letter-spacing:-.5px}
.hero h1 .hl{color:var(--c1);display:inline-block;animation:wiggle 3s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.hero p{margin:0;color:var(--muted);font-size:18px}
.badge{display:inline-block;background:var(--c1);color:#fff;border-radius:12px;padding:4px 12px;font-weight:600;font-size:15px}

/* mascota */
.mascot{width:130px;height:130px;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.mascot.jump{animation:jump .6s ease}
.mascot.sad{animation:sad .7s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-28px) scale(1.08,.95)}60%{transform:translateY(0) scale(1.1,.9)}100%{transform:none}}
@keyframes sad{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.mascot .eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.speech{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:12px 16px;
  font-size:18px;font-weight:500;box-shadow:var(--shadow);max-width:520px}
.speech:before{content:"";position:absolute;left:-14px;top:24px;border:10px solid transparent;border-right-color:var(--ink)}
.speech:after{content:"";position:absolute;left:-8px;top:26px;border:8px solid transparent;border-right-color:var(--card)}

/* ---------- mapa de missions ---------- */
.mapwrap{position:relative;margin-top:26px}
.missions{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 14px;position:relative}
.mission-btn{cursor:pointer;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0;animation:popIn .55s cubic-bezier(.2,.9,.3,1.4) forwards}
.mission-btn:nth-child(even){margin-top:46px}
@keyframes popIn{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:none}}
.mission-btn .disc{position:relative;width:min(120px,20vw);aspect-ratio:1;border-radius:50%;background:var(--col);
  border:4px solid var(--ink);display:grid;place-items:center;font-size:clamp(34px,7vw,56px);
  box-shadow:0 8px 0 var(--ink);transition:transform .2s;animation:float 3.5s ease-in-out infinite;animation-delay:var(--d)}
.mission-btn .disc:after{content:"";position:absolute;inset:8px;border-radius:50%;border:3px dashed rgba(255,255,255,.55)}
.mission-btn:hover .disc{transform:scale(1.08) rotate(-4deg)}
.mission-btn:active .disc{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -7px}}
.mission-btn .num{position:absolute;top:-6px;left:-6px;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--ink);
  font-size:17px;font-weight:700;display:grid;place-items:center}
.mission-btn .done-mark{position:absolute;bottom:-6px;right:-6px;width:36px;height:36px;border-radius:50%;background:var(--gold);
  border:3px solid var(--ink);font-size:18px;display:grid;place-items:center}
.mission-btn .name{font-weight:600;font-size:clamp(14px,2.4vw,18px);text-align:center;line-height:1.1;max-width:140px}
.stars{font-size:20px;letter-spacing:2px;color:#d9cdb7}
.stars .on{color:var(--gold);text-shadow:0 2px 0 #c98a00}

.final-btn{cursor:pointer;margin:40px auto 0;display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#ffd166,#ff9f1c);
  border:4px solid var(--ink);border-radius:28px;padding:16px 26px;box-shadow:0 8px 0 var(--ink);font-size:clamp(20px,4vw,28px);font-weight:700;
  transition:transform .15s}
.final-btn .tro{font-size:46px;animation:wiggle 1.8s ease-in-out infinite}
.final-btn small{display:block;font-size:15px;font-weight:500}
.final-btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.foot{margin-top:40px;text-align:center;color:var(--muted);font-size:14px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}

/* ---------- pantalla de missió ---------- */
.mbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mtitle{display:flex;align-items:center;gap:10px;font-size:clamp(22px,4.5vw,32px);font-weight:700}
.mtitle .em{width:56px;height:56px;border-radius:50%;background:var(--mc);border:3px solid var(--ink);display:grid;place-items:center;font-size:30px}
.steps{display:flex;gap:8px;margin:18px 0 12px;flex-wrap:wrap}
.steps i{flex:1;min-width:30px;height:14px;border-radius:99px;background:#eadfcb;border:2px solid var(--ink);position:relative;overflow:hidden}
.steps i.on:after{content:"";position:absolute;inset:0;background:var(--mc);animation:fillbar .6s ease forwards;transform-origin:left}
.steps i.cur{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--mc)}
@keyframes fillbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.stage{background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);padding:22px;position:relative}
.stage .enter{animation:stepIn .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes stepIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.act-h{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:clamp(20px,3.8vw,28px)}
.act-h .tag{font-size:14px;background:var(--mc);color:#fff;border-radius:10px;padding:3px 10px;font-weight:600;white-space:nowrap}
.help{color:var(--muted);font-size:17px;margin:0 0 18px;display:flex;gap:8px;align-items:flex-start}
.help b{color:var(--ink)}

/* targetes Recorda (flip) */
.intro{font-size:19px;margin:0 0 14px}
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.flip{perspective:900px;cursor:pointer;min-height:170px;background:none;border:0;padding:0;opacity:0;animation:popIn .5s cubic-bezier(.2,.9,.3,1.4) forwards}
.flip .inner{position:relative;width:100%;height:100%;min-height:170px;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.open .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;border-radius:20px;border:3px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center;box-shadow:var(--shadow)}
.flip .front{background:var(--mc);color:#fff}
.flip .front .e{font-size:52px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.flip .front .t{font-size:21px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.flip .front .hint{font-size:13px;opacity:.9;margin-top:6px}
.flip .back{background:#fff;transform:rotateY(180deg);font-size:17px;line-height:1.3}
.flip .back .bt{color:var(--mc);font-size:18px;font-weight:700;display:block;margin-bottom:6px}
.flip .back b{color:var(--mc)}

/* fitxes arrossegables */
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border:3px dashed var(--line);border-radius:20px;background:#fffdf8;min-height:70px;margin-bottom:18px}
.pool:empty{display:none}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:#fff;border:3px solid var(--ink);border-radius:16px;
  padding:9px 14px;font-size:18px;font-weight:500;box-shadow:0 5px 0 var(--ink);transition:transform .15s, box-shadow .15s, opacity .2s;
  line-height:1.15;text-align:center}
.chip:hover{transform:translateY(-3px) rotate(-1deg)}
.chip.sel{background:#fff3c4;transform:translateY(-4px) scale(1.06);box-shadow:0 0 0 4px var(--gold),0 7px 0 var(--ink)}
.chip.src{opacity:.25}
.chip.placed{cursor:default;box-shadow:0 3px 0 var(--ink);background:#e9fbf1;border-color:#1b7f4b;animation:pop .45s cubic-bezier(.2,.9,.3,1.6)}
.chip.placed:hover{transform:none}
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;cursor:grabbing;transform-origin:center;
  box-shadow:0 14px 24px rgba(0,0,0,.2),0 5px 0 var(--ink)}
.ghost.back{transition:transform .3s cubic-bezier(.4,1.6,.6,1)}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{translate:0}20%{translate:-9px}40%{translate:9px}60%{translate:-6px}80%{translate:6px}}

/* caixes de classificar */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.zone{transition:transform .2s, box-shadow .2s, background .2s}
.bucket{border:3px solid var(--ink);border-radius:20px;background:var(--bc);min-height:150px;padding:10px;display:flex;flex-direction:column;cursor:pointer}
.bucket .bh{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:20px;background:#fff;border:3px solid var(--ink);
  border-radius:14px;padding:6px 10px;margin-bottom:10px}
.bucket .bh .e{font-size:26px}
.zone-items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:flex-start;flex:1}
.zone-items .chip{font-size:16px;padding:6px 10px}
.zone.hover{transform:scale(1.04);box-shadow:0 0 0 5px var(--gold)}
.zone.flash-bad{animation:shake .45s ease;box-shadow:0 0 0 5px var(--bad)}
.zone.flash-good{box-shadow:0 0 0 5px var(--good)}
.zone.ready{animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 5px rgba(255,194,61,.7)}}

/* buits */
.blanks{font-size:clamp(19px,3.2vw,24px);line-height:2.3}
.blanks p{margin:0 0 6px}
.gap{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:var(--w,110px);height:46px;
  border-bottom:4px solid var(--mc);background:#f6f1e6;border-radius:12px 12px 4px 4px;margin:0 4px;padding:0 6px;cursor:pointer}
.gap .chip{font-size:18px;padding:3px 10px;box-shadow:none;border-width:2px}
.gap.filled{background:transparent;border-bottom-color:var(--good)}

/* ordenar */
.order{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:stretch}
.slot{position:relative;border:3px dashed var(--ink);border-radius:18px;min-height:96px;display:flex;align-items:center;justify-content:center;
  background:#fffaf0;padding:16px 8px 8px;cursor:pointer}
.slot .n{position:absolute;top:-14px;left:50%;translate:-50% 0;width:32px;height:32px;border-radius:50%;background:var(--mc);color:#fff;
  border:3px solid var(--ink);font-weight:700;display:grid;place-items:center}
.slot.filled{border-style:solid;background:#e9fbf1}
.order .arrow{display:none}

/* parelles */
.match{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.mcard{border:3px solid var(--ink);border-radius:20px;background:var(--bc,#fff);padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow)}
.mcard .big{font-size:64px;line-height:1}
.mcard .txt{font-size:17px;text-align:center;font-weight:500;min-height:42px;display:flex;align-items:center}
.mcard .slot{width:100%;min-height:58px;padding:6px}

/* diagrama del cos */
.diagram{position:relative;width:100%;max-width:640px;margin:0 auto 18px;aspect-ratio:520/470}
.diagram svg{position:absolute;inset:0;width:100%;height:100%}
.dslot{position:absolute;border:3px dashed var(--ink);border-radius:14px;background:#fffaf0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dslot .chip{font-size:clamp(12px,2.6vw,17px);padding:2px 6px;box-shadow:none;border-width:2px;width:100%}
.dslot.filled{border-style:solid;background:#e9fbf1}
.dot{animation:pulse 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.4)}}

/* qüestionari */
.qcount{font-weight:600;color:var(--muted);margin-bottom:6px}
.qtext{font-size:clamp(21px,3.8vw,28px);font-weight:600;margin:0 0 18px}
.opts{display:grid;gap:12px}
.opt{cursor:pointer;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px 18px;font-size:clamp(17px,3vw,21px);
  font-weight:500;box-shadow:0 5px 0 var(--ink);transition:transform .15s;display:flex;align-items:center;gap:12px}
.opt .l{width:36px;height:36px;flex:none;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-weight:700;background:var(--bg2)}
.opt:hover{transform:translateY(-2px)}
.opt.right{background:#d7f8e6;border-color:#1b7f4b;animation:pop .45s}
.opt.right .l{background:var(--good);color:#fff}
.opt.wrong{background:#ffe0e7;animation:shake .45s;opacity:.7}
.opt[disabled]{cursor:default}
.explain{margin-top:14px;font-size:18px;background:#fff8dc;border:3px solid var(--gold);border-radius:16px;padding:10px 14px;animation:stepIn .4s}

/* enquesta */
.survey .sq{border:3px solid var(--ink);border-radius:18px;padding:12px;margin-bottom:12px;background:var(--bg2)}
.survey .sq:nth-child(even){background:#efe6ff}
.survey .sq p{margin:0 0 10px;font-weight:600;font-size:19px}
.sopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sopt{cursor:pointer;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px;font-size:16px;font-weight:500;box-shadow:0 4px 0 var(--ink)}
.sopt small{display:block;color:var(--muted);font-weight:600}
.sopt.on{background:var(--mc);color:#fff;transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.sopt.on small{color:#fff}
.result{text-align:center;padding:16px;border:3px solid var(--ink);border-radius:20px;animation:popIn .5s forwards}
.result .face{font-size:80px}

/* bàner de completat */
.donebar{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-top:20px;padding:14px 18px;border-radius:20px;
  background:#d7f8e6;border:3px solid #1b7f4b;animation:popIn .5s forwards}
.donebar .msg{font-size:22px;font-weight:700;color:#14653b}
.btn{cursor:pointer;border:4px solid var(--ink);border-radius:18px;padding:12px 22px;font-size:20px;font-weight:700;background:var(--mc,var(--c1));color:#fff;
  box-shadow:0 6px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .15s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink);text-shadow:none}
.center{text-align:center;margin-top:18px}

/* mascota acompanyant */
.buddy{position:fixed;right:12px;bottom:10px;z-index:50;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.buddy .mascot{width:86px;height:86px}
.buddy .say{background:#fff;border:3px solid var(--ink);border-radius:18px 18px 4px 18px;padding:8px 12px;font-weight:600;font-size:17px;
  box-shadow:var(--shadow);max-width:220px;opacity:0;transform:scale(.6) translateY(10px);transform-origin:right bottom;transition:all .3s cubic-bezier(.2,.9,.3,1.5)}
.buddy .say.show{opacity:1;transform:none}
#screen-map.active ~ .buddy{display:none}

/* modal final */
.modal{position:fixed;inset:0;z-index:900;background:rgba(43,45,66,.55);display:none;place-items:center;padding:16px}
.modal.show{display:grid;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal .box{background:#fff;border:4px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--ink);padding:26px;max-width:460px;width:100%;text-align:center;
  animation:popIn .55s cubic-bezier(.2,.9,.3,1.4) forwards}
.modal h2{font-size:32px;margin:6px 0}
.bigstars{font-size:58px;letter-spacing:6px;margin:8px 0}
.bigstars span{display:inline-block;color:#e2d8c6;opacity:0;animation:starIn .5s cubic-bezier(.2,.9,.3,1.8) forwards}
.bigstars span.on{color:var(--gold);text-shadow:0 4px 0 #c98a00}
@keyframes starIn{from{opacity:0;transform:scale(0) rotate(-180deg)}to{opacity:1;transform:none}}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1200}

@media (max-width:640px){
  .missions{grid-template-columns:repeat(2,1fr);gap:22px 10px}
  .mission-btn .disc{width:min(118px,34vw)}
  .mission-btn:nth-child(even){margin-top:40px}
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .hero .mascot{width:110px;height:110px}
  .speech:before,.speech:after{display:none}
  .stage{padding:16px;border-radius:22px}
  .chip{font-size:15px;padding:7px 10px;border-radius:13px;box-shadow:0 4px 0 var(--ink)}
  .pool{gap:8px;padding:10px}
  .mtitle{font-size:21px;flex:1;min-width:0}
  .mtitle .em{width:44px;height:44px;font-size:24px;flex:none}
  .mbar .spacer{display:none}
  .buckets{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .bucket{min-height:110px;padding:8px}
  .bucket .bh{font-size:16px;padding:5px 6px}
  .bucket .bh .e{font-size:20px}
  .zone-items .chip{font-size:14px;padding:4px 8px}
  .blanks{line-height:2.1}
  .gap{height:40px}
  .order{grid-template-columns:1fr 1fr}
  .match{grid-template-columns:1fr 1fr;gap:10px}
  .mcard .big{font-size:48px}
  .mcard .txt{font-size:15px}
  .buddy .mascot{width:64px;height:64px}
  .buddy .say{font-size:15px}
  .sopts{grid-template-columns:1fr}
  .flipgrid{grid-template-columns:1fr 1fr}
  .flip,.flip .inner{min-height:200px}
  .flip .back{font-size:14.5px;line-height:1.25;padding:10px}
  .flip .back .bt{font-size:16px}
  .stage{padding:14px}
  .diagram{width:calc(100% + 16px);margin-left:-8px}
  .dslot .chip{font-size:13px;padding:1px 3px}
  .flip .front .e{font-size:42px}

const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];

const Sound = {
  ctx:null,
  play(notes, type='sine', vol=.18){
    if(!progress.sound) return;
    try{
      this.ctx = this.ctx || new (window.AudioContext||window.webkitAudioContext)();
      const t0=this.ctx.currentTime;
      notes.forEach(([f,start,dur])=>{
        const o=this.ctx.createOscillator(), g=this.ctx.createGain();
        o.type=type; o.frequency.value=f;
        g.gain.setValueAtTime(0,t0+start); g.gain.linearRampToValueAtTime(vol,t0+start+.02);
        g.gain.exponentialRampToValueAtTime(.001,t0+start+dur);
        o.connect(g).connect(this.ctx.destination); o.start(t0+start); o.stop(t0+start+dur+.05);
      });
    }catch(e){}
  },
  good(){ this.play([[660,0,.12],[880,.08,.18]],'triangle'); },
  bad(){ this.play([[240,0,.15],[180,.12,.22]],'square',.08); },
  pick(){ this.play([[520,0,.06]],'sine',.08); },
  flip(){ this.play([[420,0,.08],[620,.05,.1]],'sine',.1); },
  win(){ this.play([[523,0,.15],[659,.13,.15],[784,.26,.15],[1047,.39,.4]],'triangle',.2); }
};

/* ================= confeti ================= */
const cv=$('#confetti'), cx=cv.getContext('2d'); let parts=[], confRun=false;
function confetti(n=120){
  cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const cols=['#2fbf71','#ffb703','#3a86ff','#ef476f','#8f5cf7','#fb8500','#06b6a4'];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-6,
    r:Math.random()*6+4,c:pick(cols),rot:Math.random()*6,vr:(Math.random()-.5)*.3,life:0,shape:Math.random()<.3?'c':'r'});
  if(!confRun){confRun=true;requestAnimationFrame(tick);}
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    if(p.shape==='c'){cx.beginPath();cx.arc(0,0,p.r*.6,0,7);cx.fill();} else cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);
    cx.restore();});
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<260);
  if(parts.length) requestAnimationFrame(tick); else {confRun=false;cx.clearRect(0,0,innerWidth,innerHeight);}
}

/* ---------- motor d'arrossegar ---------- */
function makeChip(text, val, req=true){
  const c=el('button','chip',text); c.type='button'; c.dataset.val=norm(val); if(req) c.dataset.req='1'; return c;
}
function zoneAccepts(zone, chip){
  const acc=zone.dataset.accept.split('|').map(norm);
  if(zone.dataset.cap==='1' && zone.querySelector('.chip')) return false;
  return acc.includes(chip.dataset.val);
}
function remaining(){ return document.querySelectorAll('#stage .pool .chip[data-req]').length; }
function tryDrop(chip, zone, ghost){
  if(!zone || !chip) return false;
  if(zoneAccepts(zone, chip)){
    const target = zone.querySelector('.zone-items') || zone;
    chip.classList.remove('sel','src'); chip.classList.add('placed'); chip.removeAttribute('data-req');
    chip.tabIndex=-1;
    target.appendChild(chip);
    if(zone.dataset.cap==='1') zone.classList.add('filled');
    zone.classList.add('flash-good'); setTimeout(()=>zone.classList.remove('flash-good'),500);
    if(ghost) ghost.remove();
    Sound.good(); say(pick(GOOD),'jump');
    if(remaining()===0) setTimeout(()=>stepDone(),450);
    return true;
  } else {
    M.errors++;
    zone.classList.remove('flash-bad'); void zone.offsetWidth; zone.classList.add('flash-bad'); setTimeout(()=>zone.classList.remove('flash-bad'),500);
    Sound.bad(); say(pick(BAD),'sad');
    if(ghost){
      const r=chip.getBoundingClientRect(); ghost.classList.add('back');
      ghost.style.transform=`translate(${r.left}px,${r.top}px)`;
      setTimeout(()=>{ghost.remove(); chip.classList.remove('src'); chip.classList.remove('shake'); void chip.offsetWidth; chip.classList.add('shake');},300);
    } else { chip.classList.remove('shake'); void chip.offsetWidth; chip.classList.add('shake'); }
    return false;
  }
}
// estat de l'arrossegament (ratolí + tàctil amb Pointer Events) + mode tocar
let D=null, selected=null, hoverZone=null;
document.addEventListener('pointerdown',e=>{
  const chip=e.target.closest('#stage .chip:not(.placed)'); if(!chip) return;
  if(e.button!==undefined && e.button!==0) return;
  D={chip,x0:e.clientX,y0:e.clientY,moved:false,id:e.pointerId};
});
document.addEventListener('pointermove',e=>{
  if(!D || e.pointerId!==D.id) return;
  const dx=e.clientX-D.x0, dy=e.clientY-D.y0;
  if(!D.moved){
    if(Math.hypot(dx,dy)<7) return;
    D.moved=true;
    const r=D.chip.getBoundingClientRect();
    D.offX=D.x0-r.left; D.offY=D.y0-r.top;
    const g=D.chip.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel');
    g.style.width=r.width+'px'; document.body.appendChild(g); D.ghost=g;
    D.chip.classList.add('src'); if(selected){selected.classList.remove('sel');selected=null;}
    Sound.pick();
  }
  e.preventDefault();
  D.cx=e.clientX; D.cy=e.clientY;
  D.ghost.style.transform=`translate(${e.clientX-D.offX}px,${e.clientY-D.offY}px) rotate(-4deg) scale(1.08)`;
  updateHover();
  if(!D.scrolling){ D.scrolling=true; requestAnimationFrame(autoScroll); }
},{passive:false});
function updateHover(){
  if(!D) return;
  const z=document.elementFromPoint(D.cx,D.cy)?.closest('#stage .zone');
  if(z!==hoverZone){ hoverZone?.classList.remove('hover'); hoverZone=z; z?.classList.add('hover'); }
}
// desplaçament automàtic quan arrossegues prop de la vora (mòbils i tauletes)
function autoScroll(){
  if(!D || !D.moved){ return; }
  const edge=Math.min(110, innerHeight*.18); let v=0;
  if(D.cy>innerHeight-edge) v=Math.ceil((D.cy-(innerHeight-edge))/edge*18);
  else if(D.cy<edge) v=-Math.ceil((edge-D.cy)/edge*18);
  if(v){ scrollBy(0,v); updateHover(); }
  requestAnimationFrame(autoScroll);
}
function endDrag(e, cancel){
  if(!D || (e && e.pointerId!==D.id)) return;
  const d=D; D=null; hoverZone?.classList.remove('hover'); hoverZone=null;
  if(!d.moved){ // és un toc → seleccionar
    if(cancel) return;
    if(selected===d.chip){ d.chip.classList.remove('sel'); selected=null; }
    else { selected?.classList.remove('sel'); selected=d.chip; d.chip.classList.add('sel'); Sound.pick(); }
    return;
  }
  const z = cancel ? null : document.elementFromPoint(e.clientX,e.clientY)?.closest('#stage .zone');
  if(z) tryDrop(d.chip,z,d.ghost);
  else { // tornar al lloc
    const r=d.chip.getBoundingClientRect(); d.ghost.classList.add('back'); d.ghost.style.transform=`translate(${r.left}px,${r.top}px)`;
    setTimeout(()=>{d.ghost.remove(); d.chip.classList.remove('src');},300);
  }
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));
// mode tocar: chip seleccionat + tocar zona
document.addEventListener('click',e=>{
  if(!selected) return;
  const z=e.target.closest('#stage .zone'); if(!z) return;
  if(e.target.closest('.chip:not(.placed)')) return;
  const c=selected; selected=null; c.classList.remove('sel'); tryDrop(c,z,null);
});
// teclat: Enter sobre un chip el selecciona; Enter sobre una zona el deixa
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const c=e.target.closest?.('#stage .chip:not(.placed)');
  if(c){ e.preventDefault(); selected?.classList.remove('sel'); selected=c; c.classList.add('sel'); Sound.pick(); return; }
  const z=e.target.closest?.('#stage .zone');
  if(z && selected){ e.preventDefault(); const s=selected; selected=null; s.classList.remove('sel'); tryDrop(s,z,null); }
});
function makePool(chips){ const p=el('div','pool'); shuffle(chips).forEach(c=>p.appendChild(c)); return p; }

/* ---------- Classificar ---------- */
function renderSort(box, step){
  header(box, step);
  box.appendChild(makePool(step.items.map(([t,b])=>makeChip(t,b))));
  const bs=el('div','buckets');
  step.buckets.forEach(b=>{
    const z=el('div','bucket zone',`<div class="bh"><span class="e">${b.e}</span>${b.label}</div><div class="zone-items"></div>`);
    z.dataset.accept=b.id; z.style.setProperty('--bc',b.bc||'#fff'); z.tabIndex=0; bs.appendChild(z);
  });
  box.appendChild(bs);
}
/* ---------- Completar buits ---------- */
function renderBlanks(box, step){
  header(box, step);
  const words=[];
  const txt=el('div','blanks');
  step.text.forEach(line=>{
    const p=el('p');
    p.innerHTML=line.replace(/\[([^\]]+)\]/g,(_,w)=>{words.push(w);return `<span class="gap zone" data-cap="1" data-accept="${w}" tabindex="0" style="--w:${Math.max(90,w.length*13+30)}px"></span>`;});
    txt.appendChild(p);
  });
  const chips=words.map(w=>makeChip(w,w)).concat((step.extra||[]).map(w=>makeChip(w,'__'+w,false)));
  box.appendChild(makePool(chips)); box.appendChild(txt);
}
/* ---------- Ordenar ---------- */
function renderOrder(box, step){
  header(box, step);
  box.appendChild(makePool(step.items.map((t,i)=>makeChip(t,String(i)))));
  const o=el('div','order');
  step.items.forEach((_,i)=>{const s=el('div','slot zone',`<span class="n">${i+1}</span>`); s.dataset.accept=String(i); s.dataset.cap='1'; s.tabIndex=0; o.appendChild(s);});
  box.appendChild(o);
}
/* ---------- Parelles ---------- */
function renderMatch(box, step){
  header(box, step);
  box.appendChild(makePool(step.pairs.map(p=>makeChip(p.a.toUpperCase(),p.a))));
  const g=el('div','match');
  shuffle(step.pairs).forEach(p=>{
    const c=el('div','mcard',`<div class="big">${p.big}</div>${p.txt?`<div class="txt">${p.txt}</div>`:''}`); c.style.setProperty('--bc',p.bc||'#fff');
    const s=el('div','slot zone'); s.dataset.accept=p.a; s.dataset.cap='1'; s.tabIndex=0; c.appendChild(s); g.appendChild(c);
  });
  box.appendChild(g);
}
/* ---------- Diagrama del cos ---------- */
function bodySVG(slots){
  const skin='#f6c19a', sk='#2b2d42';
  const lines=slots.map(s=>{const x1=s.sx<260?s.sx+62:s.sx-62;return `<path d="M${x1} ${s.sy} L${s.px} ${s.py}" stroke="${sk}" stroke-width="2.5" stroke-dasharray="5 5" fill="none"/>`;}).join('');
  const dots=slots.map(s=>`<circle class="dot" cx="${s.px}" cy="${s.py}" r="6" fill="#ff006e" stroke="#fff" stroke-width="2.5"/>`).join('');
  return `<svg viewBox="0 0 520 470" aria-hidden="true">
   <g stroke-linecap="round" fill="none">
    <path d="M238 285 L236 360 L234 425" stroke="${sk}" stroke-width="30"/><path d="M238 285 L236 360 L234 425" stroke="${skin}" stroke-width="22"/>
    <path d="M282 285 L284 360 L286 425" stroke="${sk}" stroke-width="30"/><path d="M282 285 L284 360 L286 425" stroke="${skin}" stroke-width="22"/>
    <path d="M214 150 L186 210 L172 268" stroke="${sk}" stroke-width="27"/><path d="M214 150 L186 210 L172 268" stroke="${skin}" stroke-width="19"/>
    <path d="M306 150 L334 210 L348 268" stroke="${sk}" stroke-width="27"/><path d="M306 150 L334 210 L348 268" stroke="${skin}" stroke-width="19"/>
   </g>
   <circle cx="170" cy="282" r="15" fill="${skin}" stroke="${sk}" stroke-width="4"/>
   <circle cx="350" cy="282" r="15" fill="${skin}" stroke="${sk}" stroke-width="4"/>
   <ellipse cx="228" cy="440" rx="24" ry="13" fill="#ef476f" stroke="${sk}" stroke-width="4"/>
   <ellipse cx="292" cy="440" rx="24" ry="13" fill="#ef476f" stroke="${sk}" stroke-width="4"/>
   <rect x="210" y="236" width="100" height="62" rx="14" fill="#3a86ff" stroke="${sk}" stroke-width="4"/>
   <line x1="260" y1="262" x2="260" y2="298" stroke="${sk}" stroke-width="4"/>
   <rect x="248" y="108" width="24" height="30" fill="${skin}" stroke="${sk}" stroke-width="4"/>
   <path d="M216 134 Q260 122 304 134 L322 168 L308 176 L308 244 L212 244 L212 176 L198 168 Z" fill="#ffb703" stroke="${sk}" stroke-width="4" stroke-linejoin="round"/>
   <path d="M246 134 Q260 148 274 134" fill="none" stroke="${sk}" stroke-width="4"/>
   <circle cx="260" cy="70" r="44" fill="${skin}" stroke="${sk}" stroke-width="4"/>
   <path d="M216 66 Q218 24 260 24 Q304 24 304 66 Q292 44 268 46 Q244 40 232 52 Q222 58 216 66Z" fill="#6b3e26" stroke="${sk}" stroke-width="4" stroke-linejoin="round"/>
   <circle cx="246" cy="74" r="5" fill="${sk}"/><circle cx="274" cy="74" r="5" fill="${sk}"/>
   <ellipse cx="236" cy="88" rx="7" ry="4" fill="#ff8fab"/><ellipse cx="284" cy="88" rx="7" ry="4" fill="#ff8fab"/>
   <path d="M248 92 Q260 102 272 92" fill="none" stroke="${sk}" stroke-width="4" stroke-linecap="round"/>
   ${lines}${dots}
  </svg>`;
}
function renderLabel(box, step){
  header(box, step);
  box.appendChild(makePool(step.slots.map(s=>makeChip(s.w,s.w))));
  const d=el('div','diagram'); d.innerHTML=bodySVG(step.slots);
  step.slots.forEach(s=>{
    const z=el('div','dslot zone'); z.dataset.accept=s.w; z.dataset.cap='1'; z.tabIndex=0;
    Object.assign(z.style,{left:((s.sx-62)/520*100)+'%',top:((s.sy-23)/470*100)+'%',width:(124/520*100)+'%',height:(46/470*100)+'%'});
    d.appendChild(z);
  });
  box.appendChild(d);
}
/* ---------- Qüestionari ---------- */
function renderQuiz(box, step){
  header(box, step, step.final?'🏆':null);
  const area=el('div'); box.appendChild(area);
  let qi=0, firstTry=0;
  const qs=step.questions.map(q=>{
    if(step.tf||q.keep) return q;
    const idx=shuffle(q.o.map((_,i)=>i)); return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)};
  });
  function showQ(){
    const q=qs[qi]; area.innerHTML=''; const w=el('div','enter'); area.appendChild(w);
    w.appendChild(el('div','qcount',`Pregunta ${qi+1} de ${qs.length}`));
    w.appendChild(el('p','qtext',q.q));
    const os=el('div','opts'); w.appendChild(os);
    let missed=false;
    q.o.forEach((t,i)=>{
      const b=el('button','opt',`<span class="l">${step.tf?(i===0?'✔':'✘'):'ABC'[i]}</span><span>${t}</span>`);
      b.onclick=()=>{
        if(i===q.a){
          b.classList.add('right'); os.querySelectorAll('.opt').forEach(x=>x.disabled=true);
          if(!missed) firstTry++;
          Sound.good(); say(pick(GOOD),'jump');
          if(q.e) w.appendChild(el('div','explain','💡 '+q.e));
          const nx=el('div','center'); const nb=el('button','btn', qi<qs.length-1?'Següent pregunta ➜':'Veure resultat ✨');
          nb.onclick=()=>{ qi++; if(qi<qs.length) showQ(); else { if(step.final) M.finalScore=firstTry; area.innerHTML=''; area.appendChild(el('div','result',`<div class="face">${firstTry===qs.length?'🤩':firstTry>=qs.length/2?'😄':'💪'}</div><p style="font-size:22px;font-weight:600">Has encertat <b>${firstTry} de ${qs.length}</b> a la primera!</p>`)); stepDone(); } };
          nx.appendChild(nb); w.appendChild(nx); setTimeout(()=>nb.scrollIntoView({behavior:'smooth',block:'center'}),100);
        } else {
          missed=true; M.errors++; b.classList.add('wrong'); b.disabled=true; Sound.bad(); say(pick(BAD),'sad');
        }
      };
      os.appendChild(b);
    });
  }
  showQ();
}
/* ---------- Enquesta d'hàbits ---------- */
function renderSurvey(box, step){
  header(box, step, '🔬 Taller');
  const sv=el('div','survey'); box.appendChild(sv);
  const ans=new Array(step.questions.length).fill(null);
  const res=el('div');
  step.questions.forEach((q,qi)=>{
    const d=el('div','sq',`<p>${q.q}</p>`); const os=el('div','sopts');
    q.o.forEach(([t,pts])=>{
      const b=el('button','sopt',`${t}<small>${pts} ${pts===1?'punt':'punts'}</small>`);
      b.onclick=()=>{ os.querySelectorAll('.sopt').forEach(x=>x.classList.remove('on')); b.classList.add('on'); ans[qi]=pts; Sound.pick(); check(); };
      os.appendChild(b);
    });
    d.appendChild(os); sv.appendChild(d);
  });
  box.appendChild(res);
  function check(){
    if(ans.includes(null)) return;
    const t=ans.reduce((a,b)=>a+b,0);
    const [face,bg,txt] = t<13?['☹️','#ffe0e7','Has d\'esforçar-te perquè els teus hàbits siguen saludables.']
      : t<=18?['😐','#fff1c9','Pots millorar els hàbits perquè siguen més saludables.']
      : ['😃','#d9f6e6','Tens uns hàbits bastant saludables. Enhorabona!'];
    res.innerHTML=''; const r=el('div','result',`<div class="face">${face}</div><p style="font-size:24px;font-weight:700;margin:4px 0">${t} punts</p><p style="font-size:19px;margin:0">${txt}</p>`);
    r.style.background=bg; res.appendChild(r);
    stepDone('Has avaluat els teus hàbits! 🔬');
  }
}

updateSoundBtns(); renderMap(); $('#buddy').style.display='none';
addEventListener('resize',()=>{});
